[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tasktracker"
version = "0.0.4"
description = "A task board Claude Code and Codex fill in, served as a local web panel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Olya Pimenova" }]
keywords = ["claude", "codex", "mcp", "tasks", "kanban"]

# Three runtime dependencies and no more.
#
# `mcp` is the official SDK the MCP server speaks through; fastapi and uvicorn
# serve the panel, its REST API and the MCP endpoint.
#
# `mcp` is bounded on both sides. 2.x renamed FastMCP and changed the APIs this
# package is written against, so an unbounded range installs a version that
# fails at import - which is exactly what a fresh image build did. 1.29 is the
# release the HTTP transport here was written and tested on. Everything else this package needs
# - the store, the hook, the CLI - is standard library, because a plugin that
# has to be pip-installed into the right environment before Claude can write a
# single task is a plugin that gets uninstalled.
dependencies = [
  "mcp>=1.29,<2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "pre-commit>=3"]

[project.scripts]
tasktracker = "tasktracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The web panel is shipped inside the package, so an installed wheel serves the
# same files a checkout does and there is nothing to point a path at.
[tool.setuptools.package-data]
tasktracker = [
  "www/*.html",
  "www/*.svg",
  "www/css/*",
  "www/js/*",
  "www/fonts/*",
  "www/vendor/*",
  "www/vendor/webfonts/*",
  "www/views/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The `# -*- coding: utf-8 -*-` line at the head of every module is the house
# header these projects carry; UP009 wants it gone because Python 3 assumes
# UTF-8 anyway. It stays - it is a marker somebody greps for, not an encoding
# declaration anybody relies on.
ignore = ["UP009"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `pytest --cov` measures the package, branches included. The report lists the
# lines no test reached, which is the part worth reading.
[tool.coverage.run]
source = ["tasktracker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ['if __name__ == "__main__":']
