# Run before every commit: `pre-commit install` once per checkout.
#
# Lint and format with ruff, then the test suite. The ruff version is pinned to
# the one the code was formatted with, so a hook and a local `ruff format` never
# disagree about the same file.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # The whole suite, on every commit rather than only when a .py file
      # changed: it also checks the READMEs' links, the panel's asset paths and
      # the plugin manifests, which a docs-only commit can break.
      - id: pytest
        name: pytest
        entry: python3 -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
